<script>
async function generateImage() {

    const playerName =
        document.getElementById("playerName").value || "Player";

    const season = document.getElementById("season").value;
    const rank = document.getElementById("rank").value;
    const highDmg = document.getElementById("highDmg").value || "0";
    const avgDmg = document.getElementById("avgDmg").value || "0";
    const kd = document.getElementById("kd").value || "0.0";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const rankColors = {
        "Rookie": "#A0A0A0",
        "Bronze": "#CD7F32",
        "Silver": "#C0C0C0",
        "Gold": "#FFD700",
        "Platinum": "#4DD0E1",
        "Diamond": "#3988FF",
        "Master": "#B266FF",
        "Apex Predator": "#FF3030"
    };

    const rankColor = rankColors[rank] || "#FFFFFF";

    ctx.fillStyle = "#171923";
    ctx.fillRect(0, 0, 800, 450);

    ctx.fillStyle = rankColor;
    ctx.fillRect(0, 0, 800, 12);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 42px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("APEX LEGENDS", 40, 75);

    ctx.save();
    ctx.shadowColor = rankColor;
    ctx.shadowBlur = 15;

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 48px sans-serif";
    ctx.fillText(playerName, 40, 155, 700);
    ctx.restore();

    ctx.fillStyle = "#aaaaaa";
    ctx.font = "28px sans-serif";
    ctx.fillText("SEASON", 50, 220);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 38px sans-serif";
    ctx.fillText("S" + season, 50, 270);

    ctx.fillStyle = "#aaaaaa";
    ctx.font = "28px sans-serif";
    ctx.fillText("RANK", 300, 220);

    ctx.fillStyle = rankColor;
    ctx.font = "bold 38px sans-serif";
    ctx.fillText(rank, 300, 270);

    const stats = [
        ["HIGH DMG", highDmg],
        ["AVG DMG", avgDmg],
        ["K/D", kd]
    ];

    stats.forEach((stat, i) => {
        const x = 50 + i * 250;

        ctx.fillStyle = "#303747";
        ctx.fillRect(x, 310, 210, 120);

        ctx.fillStyle = "#aaaaaa";
        ctx.font = "22px sans-serif";
        ctx.fillText(stat[0], x + 20, 350);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 42px sans-serif";
        ctx.fillText(stat[1], x + 20, 405);
    });

    // PNG画像を作成
    const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/png")
    );

    if (!blob) {
        alert("画像の生成に失敗しました");
        return;
    }

    // 画像をコピー
    try {
        await navigator.clipboard.write([
            new ClipboardItem({
                "image/png": blob
            })
        ]);

        alert("画像をコピーしました！ Ctrl + V で貼り付けできます。");

    } catch (error) {
        // コピーできない場合はダウンロード
        const link = document.createElement("a");
        link.download = "apex-stats.png";
        link.href = URL.createObjectURL(blob);
        link.click();

        URL.revokeObjectURL(link.href);

        alert("コピーできなかったため、画像をダウンロードしました。");
    }
}
</script>
